name: Construire APK OPTA V3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Preparer Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          validate-wrappers: false
          cache-provider: basic

      - name: Compiler APK
        working-directory: OPTA_Test_Mobile_V3_Android
        run: gradle :app:assembleDebug --no-daemon --console=plain --stacktrace

      - name: Enregistrer APK
        uses: actions/upload-artifact@v4
        with:
          name: OPTA-Test-Mobile-3-APK
          path: OPTA_Test_Mobile_V3_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
